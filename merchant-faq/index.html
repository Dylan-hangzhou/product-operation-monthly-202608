<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家答疑FAQ维护进展</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1120;--card:#111827;--border:#1e293b;--accent:#06b6d4;--accent2:#8b5cf6;--text:#e2e8f0;--muted:#64748b;--glow:0 0 20px rgba(6,182,212,.15)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:32px 24px}

/* ── Header ── */
.header{margin-bottom:28px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.header .sub{font-size:13px;color:var(--muted);margin-top:6px}

/* ── Stat Cards ── */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 20px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:var(--accent);box-shadow:var(--glow)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card .val{font-size:32px;font-weight:800;color:#f1f5f9;font-variant-numeric:tabular-nums}
.card .label{font-size:13px;color:var(--muted);margin-top:4px}
.card .extra{font-size:12px;margin-top:8px;color:var(--accent);opacity:.85}
.card .extra.warn{color:#f59e0b}

/* ── Filter Bar ── */
.filter-bar{background:rgba(17,24,39,.8);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:20px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.filter-bar label{font-size:12px;color:var(--muted);font-weight:500;margin-right:4px;text-transform:uppercase;letter-spacing:.5px}
.filter-bar select,.filter-bar input{font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#0f172a;color:var(--text);outline:none;transition:border-color .2s}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(6,182,212,.2)}
.filter-bar select option{background:#0f172a}
.reset-btn{font-size:12px;padding:6px 16px;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.reset-btn:hover{border-color:var(--accent);color:var(--accent)}
.result-count{font-size:12px;color:var(--muted);margin-left:auto}

/* ── Tabs ── */
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:1px solid var(--border)}
.tab-btn{padding:10px 28px;font-size:14px;font-weight:600;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);transition:all .25s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--accent)}

/* ── Table ── */
.tab-panel{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:4px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:11px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid rgba(30,41,59,.5);color:var(--text);vertical-align:top}
tr:hover td{background:rgba(6,182,212,.04)}
.num-cell{text-align:center;font-variant-numeric:tabular-nums}
.link-title{color:var(--accent);text-decoration:none;word-break:break-word;transition:color .2s}
.link-title:hover{color:#22d3ee;text-decoration:underline}
.creator-link{color:var(--accent);cursor:pointer;font-weight:500;transition:color .2s}
.creator-link:hover{color:#22d3ee;text-decoration:underline}

/* ── Status Tags ── */
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.3px}
.tag-pass{background:rgba(34,197,94,.15);color:#4ade80}
.tag-review{background:rgba(251,191,36,.15);color:#fbbf24}
.tag-reject{background:rgba(239,68,68,.15);color:#f87171}
.tag-draft{background:rgba(148,163,184,.12);color:#94a3b8}
.tag-online{background:rgba(59,130,246,.15);color:#60a5fa}
.tag-offline{background:rgba(100,116,139,.12);color:#64748b}

/* ── Progress Bar ── */
.progress-wrap{margin-top:10px}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s ease}
.progress-text{font-size:11px;color:var(--muted);margin-top:4px}

/* ── Responsive ── */
@media(max-width:768px){.cards{grid-template-columns:1fr}.filter-bar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>商家答疑FAQ维护进展</h1>
    <div class="sub">数据来源：Links FAQ知识库 &middot; 更新时间 <span id="genTime"></span></div>
  </div>

  <!-- 统计卡片 -->
  <div class="cards">
    <div class="card">
      <div class="val" id="cardTotal">0</div>
      <div class="label">FAQ总数</div>
      <div class="extra" id="cardTarget"></div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0"></div></div><div class="progress-text" id="progressText"></div></div>
    </div>
    <div class="card">
      <div class="val" id="cardMonth">0</div>
      <div class="label">本月新增FAQ数</div>
      <div class="extra" id="cardPerCapita"></div>
    </div>
    <div class="card">
      <div class="val" id="cardReuse">0</div>
      <div class="label">总复用次数</div>
    </div>
  </div>

  <!-- 全局筛选 -->
  <div class="filter-bar">
    <div><label>创建人</label><select id="filterCreator" onchange="applyFilter()"><option value="">全部</option></select></div>
    <div><label>创建时间</label><input type="date" id="filterDateFrom" onchange="applyFilter()"><span style="color:var(--muted);margin:0 4px">~</span><input type="date" id="filterDateTo" onchange="applyFilter()"></div>
    <div><label>知识点目录</label><select id="filterCategory" onchange="applyFilter()"><option value="">全部</option></select></div>
    <button class="reset-btn" onclick="resetFilter()">重置</button>
    <span class="result-count" id="filterResultCount"></span>
  </div>

  <!-- 页签 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">按创建人汇总</button>
    <button class="tab-btn" onclick="switchTab(1)">FAQ明细</button>
  </div>

  <div id="tab0" class="tab-panel">
    <table><thead><tr>
      <th style="width:40px">#</th><th>创建人</th><th class="num-cell">FAQ数量</th><th class="num-cell">总复用次数</th><th style="width:90px">操作</th>
    </tr></thead><tbody id="summaryBody"></tbody></table>
  </div>

  <div id="tab1" class="tab-panel" style="display:none">
    <table><thead><tr>
      <th style="width:40px">#</th><th style="min-width:260px">FAQ标题</th><th>状态</th><th>创建人</th><th>知识点目录</th><th class="num-cell">复用次数</th>
    </tr></thead><tbody id="detailBody"></tbody></table>
  </div>
</div>

const SUMMARY = [{"creator": "黄春生", "count": 30, "reuse": 3}, {"creator": "王硕", "count": 21, "reuse": 1}, {"creator": "裴玉", "count": 18, "reuse": 1}, {"creator": "周玲玲", "count": 7, "reuse": 1}, {"creator": "黄豪", "count": 6, "reuse": 0}, {"creator": "唐伯文", "count": 5, "reuse": 0}, {"creator": "张杭萍", "count": 5, "reuse": 0}, {"creator": "赵烈幸", "count": 4, "reuse": 0}, {"creator": "代飞飞", "count": 3, "reuse": 1}, {"creator": "杨宇轩", "count": 3, "reuse": 0}, {"creator": "马浩楠", "count": 1, "reuse": 0}, {"creator": "杨飞", "count": 1, "reuse": 1}];
const TARGET = 300;
const DATE_MIN = "2026-01-21";
const DATE_MAX = "2026-09-20";

// 当前月份
const NOW = new Date();
const CUR_YEAR = NOW.getFullYear();
const CUR_MONTH = String(NOW.getMonth()+1).padStart(2,'0');

document.getElementById("genTime").textContent = NOW.toLocaleString("zh-CN");

function statusClass(s){
  if(["PASS","已发布","已上线"].includes(s))return"tag-pass";
  if(["评审中","UNDER_REVIEW"].includes(s))return"tag-review";
  if(["已驳回","REJECTED"].includes(s))return"tag-reject";
  if(["草稿","DRAFT"].includes(s))return"tag-draft";
  if(s==="ONLINE")return"tag-online";
  if(s==="OFFLINE")return"tag-offline";
  return"tag-draft";
}

function esc(s){return s?s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):"";}

// ── 卡片数据（始终基于全量数据，不受筛选影响）──
function updateCards(){
  const total=DATA.length;
  const reuse=DATA.reduce((s,r)=>s+r.reuse,0);
  const monthItems=DATA.filter(r=>{const d=(r.createTime||"").slice(0,7);return d===CUR_YEAR+"-"+CUR_MONTH;});
  const monthCount=monthItems.length;
  const monthCreators=[...new Set(monthItems.map(r=>r.creator).filter(Boolean))].length;
  const perCapita=monthCreators?((monthCount/monthCreators).toFixed(1)):0;
  const gap=Math.max(0,TARGET-total);
  const pct=Math.min(100,Math.round(total/TARGET*100));

  document.getElementById("cardTotal").textContent=total;
  document.getElementById("cardTarget").textContent=gap>0?"目标 "+TARGET+"，还差 "+gap+" 个":"已达标 ✓";
  document.getElementById("cardTarget").className=gap>0?"extra warn":"extra";
  document.getElementById("progressFill").style.width=pct+"%";
  document.getElementById("progressText").textContent=total+" / "+TARGET+" ("+pct+"%)";

  document.getElementById("cardMonth").textContent=monthCount;
  document.getElementById("cardPerCapita").textContent="人均新增 "+perCapita+" 条";

  document.getElementById("cardReuse").textContent=reuse;
}

// ── 页签切换 ──
function switchTab(idx){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",i===idx));
  document.getElementById("tab0").style.display=idx===0?"":"none";
  document.getElementById("tab1").style.display=idx===1?"":"none";
}

// ── 汇总页签 ──
function renderSummary(list){
  const body=document.getElementById("summaryBody");
  if(!list.length){body.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px">无匹配数据</td></tr>';return;}
  body.innerHTML=list.map((s,i)=>`
    <tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td><span class="creator-link" onclick="goDetail('${s.creator.replace(/'/g,"\\'")}')">${esc(s.creator)}</span></td>
      <td class="num-cell">${s.count}</td>
      <td class="num-cell">${s.reuse}</td>
      <td><span class="creator-link" onclick="goDetail('${s.creator.replace(/'/g,"\\'")}')">查看明细</span></td>
    </tr>
  `).join("");
}

function goDetail(creator){
  switchTab(1);
  document.getElementById("filterCreator").value=creator;
  applyFilter();
}

// ── 筛选 ──
function initFilters(){
  const cs=document.getElementById("filterCreator");
  SUMMARY.forEach(s=>{const o=document.createElement("option");o.value=s.creator;o.textContent=s.creator+" ("+s.count+")";cs.appendChild(o);});
  const cat=document.getElementById("filterCategory");
  [...new Set(DATA.map(r=>r.category).filter(Boolean))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;cat.appendChild(o);});
  document.getElementById("filterDateFrom").min=DATE_MIN;
  document.getElementById("filterDateFrom").max=DATE_MAX;
  document.getElementById("filterDateTo").min=DATE_MIN;
  document.getElementById("filterDateTo").max=DATE_MAX;
}

function applyFilter(){
  const creator=document.getElementById("filterCreator").value;
  const dateFrom=document.getElementById("filterDateFrom").value;
  const dateTo=document.getElementById("filterDateTo").value;
  const category=document.getElementById("filterCategory").value;

  let filtered=DATA.filter(r=>{
    if(creator&&r.creator!==creator)return false;
    if(category&&r.category!==category)return false;
    if(dateFrom||dateTo){const d=(r.createTime||"").slice(0,10);if(dateFrom&&d<dateFrom)return false;if(dateTo&&d>dateTo)return false;}
    return true;
  });

  // 卡片始终基于全量数据
  updateCards();
  document.getElementById("filterResultCount").textContent="共 "+filtered.length+" 条";

  // 汇总页签：按创建人重新聚合
  const agg={};
  filtered.forEach(r=>{
    const c=r.creator;
    if(!agg[c])agg[c]={creator:c,count:0,reuse:0};
    agg[c].count++;
    agg[c].reuse+=r.reuse;
  });
  const summaryFiltered=Object.values(agg).sort((a,b)=>b.count-a.count);
  renderSummary(summaryFiltered);

  // 明细页签
  renderDetail(filtered);
}

function renderDetail(rows){
  const body=document.getElementById("detailBody");
  if(!rows.length){body.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">无匹配数据</td></tr>';return;}
  body.innerHTML=rows.map((r,i)=>`
    <tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td>${r.url?'<a class="link-title" href="'+r.url+'" target="_blank">'+esc(r.title)+'</a>':esc(r.title)}</td>
      <td><span class="tag ${statusClass(r.status)}">${esc(r.status)}</span></td>
      <td>${esc(r.creator)}</td>
      <td>${esc(r.category)}</td>
      <td class="num-cell">${r.reuse}</td>
    </tr>
  `).join("");
}

function resetFilter(){
  document.getElementById("filterCreator").value="";
  document.getElementById("filterDateFrom").value="";
  document.getElementById("filterDateTo").value="";
  document.getElementById("filterCategory").value="";
  applyFilter();
}

// 启动
initFilters();
document.getElementById("filterDateFrom").value="2026-09-01";
applyFilter();
</script>
