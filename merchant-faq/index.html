const SUMMARY = [{"creator": "墨岱(黄春生)", "count": 40, "reuse": 6}, {"creator": "王硕", "count": 17, "reuse": 0}, {"creator": "裴玉", "count": 16, "reuse": 1}, {"creator": "唐伯文", "count": 6, "reuse": 1}, {"creator": "周玲玲", "count": 6, "reuse": 0}, {"creator": "黄豪", "count": 5, "reuse": 0}, {"creator": "张杭萍", "count": 5, "reuse": 0}, {"creator": "赵烈幸", "count": 3, "reuse": 0}, {"creator": "杨宇轩", "count": 3, "reuse": 0}, {"creator": "马浩楠", "count": 1, "reuse": 0}];
const DATE_MIN = "2026-01-21";
const DATE_MAX = "2026-09-20";

// 初始化
document.getElementById("genTime").textContent = new Date().toLocaleString("zh-CN");
document.getElementById("totalCount").textContent = DATA.length;
document.getElementById("cardTotal").textContent = DATA.length;
document.getElementById("cardReuse").textContent = DATA.reduce((s, r) => s + r.reuse, 0);
document.getElementById("cardCreators").textContent = SUMMARY.length;

// 状态样式映射
function statusClass(s) {
  if (s === "PASS" || s === "已发布" || s === "已上线") return "status-pass";
  if (s === "评审中" || s === "UNDER_REVIEW") return "status-review";
  if (s === "已驳回" || s === "REJECTED") return "status-reject";
  if (s === "草稿" || s === "DRAFT") return "status-draft";
  if (s === "ONLINE") return "status-online";
  if (s === "OFFLINE") return "status-offline";
  return "status-draft";
}

// 页签切换
function switchTab(idx) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
  document.getElementById("tab0").style.display = idx === 0 ? "" : "none";
  document.getElementById("tab1").style.display = idx === 1 ? "" : "none";
}

// 渲染汇总页签
function renderSummary() {
  const body = document.getElementById("summaryBody");
  body.innerHTML = SUMMARY.map((s, i) => `
    <tr>
      <td class="text-gray-400">${i + 1}</td>
      <td><span class="creator-link" onclick="goDetail('${s.creator.replace("'", "\\'")}')">${s.creator}</span></td>
      <td class="num-cell">${s.count}</td>
      <td class="num-cell">${s.reuse}</td>
      <td><span class="creator-link" onclick="goDetail('${s.creator.replace("'", "\\'")}')">查看明细</span></td>
    </tr>
  `).join("");
}

// 从汇总页跳转到明细页并筛选
function goDetail(creator) {
  switchTab(1);
  document.getElementById("filterCreator").value = creator;
  applyFilter();
}

// 填筛选下拉
function initFilters() {
  const creatorSel = document.getElementById("filterCreator");
  SUMMARY.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.creator;
    opt.textContent = `${s.creator} (${s.count})`;
    creatorSel.appendChild(opt);
  });
  const catSel = document.getElementById("filterCategory");
  const cats = [...new Set(DATA.map(r => r.category).filter(Boolean))].sort();
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    catSel.appendChild(opt);
  });
  document.getElementById("filterDateFrom").min = DATE_MIN;
  document.getElementById("filterDateFrom").max = DATE_MAX;
  document.getElementById("filterDateTo").min = DATE_MIN;
  document.getElementById("filterDateTo").max = DATE_MAX;
}

// 筛选并渲染明细
function applyFilter() {
  const creator = document.getElementById("filterCreator").value;
  const dateFrom = document.getElementById("filterDateFrom").value;
  const dateTo = document.getElementById("filterDateTo").value;
  const category = document.getElementById("filterCategory").value;

  let filtered = DATA.filter(r => {
    if (creator && r.creator !== creator) return false;
    if (category && r.category !== category) return false;
    if (dateFrom || dateTo) {
      const d = (r.createTime || "").slice(0, 10);
      if (dateFrom && d < dateFrom) return false;
      if (dateTo && d > dateTo) return false;
    }
    return true;
  });

  document.getElementById("filterResultCount").textContent = `共 ${filtered.length} 条`;
  renderDetail(filtered);
}

function renderDetail(rows) {
  const body = document.getElementById("detailBody");
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400 py-8">无匹配数据</td></tr>';
    return;
  }
  body.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="text-gray-400">${i + 1}</td>
      <td>${r.url ? `<a class="link-title" href="${r.url}" target="_blank">${esc(r.title)}</a>` : esc(r.title)}</td>
      <td><span class="status-tag ${statusClass(r.status)}">${esc(r.status)}</span></td>
      <td>${esc(r.creator)}</td>
      <td>${esc(r.category)}</td>
      <td class="num-cell">${r.reuse}</td>
    </tr>
  `).join("");
}

function esc(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function resetFilter() {
  document.getElementById("filterCreator").value = "";
  document.getElementById("filterDateFrom").value = "";
  document.getElementById("filterDateTo").value = "";
  document.getElementById("filterCategory").value = "";
  applyFilter();
}

// 启动
renderSummary();
initFilters();
applyFilter();
</script>
